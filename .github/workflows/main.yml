name: Build Kernel (SukiSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      O: out

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex make \
            build-essential \
            libssl-dev libelf-dev \
            dwarves \
            python3 python3-pip \
            ccache git curl wget unzip rsync \
            zstd jq \
            lld llvm clang
          echo "CCACHE_DIR=${GITHUB_WORKSPACE}/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref }}-
            ccache-${{ runner.os }}-

      - name: Download Proton-Clang (latest, no 404)
        run: |
          set -euxo pipefail
          mkdir -p "${HOME}/clang"
          cd "${HOME}/clang"

          # GitHub API: latest release assets for kdrag0n/proton-clang
          API="https://api.github.com/repos/kdrag0n/proton-clang/releases/latest"
          URL="$(curl -fsSL "$API" | jq -r '.assets[].browser_download_url' | grep -E '\.tar\.zst$' | head -n1)"

          if [ -z "${URL}" ] || [ "${URL}" = "null" ]; then
            echo "ERROR: Cannot find proton-clang tar.zst in latest release assets."
            curl -fsSL "$API" | head -n 50 || true
            exit 1
          fi

          echo "Downloading: $URL"
          curl -L --fail -o proton-clang.tar.zst "$URL"
          tar --zstd -xf proton-clang.tar.zst
          CLANG_DIR="$(find . -maxdepth 2 -type d -name 'proton-clang*' | head -n1)"
          if [ -z "${CLANG_DIR}" ]; then
            echo "ERROR: Proton-Clang directory not found after extract."
            ls -la
            exit 1
          fi

          echo "CLANG_DIR=${HOME}/clang/${CLANG_DIR#./}" >> $GITHUB_ENV
          echo "${HOME}/clang/${CLANG_DIR#./}/bin" >> $GITHUB_PATH

      - name: Verify clang tools
        run: |
          set -euxo pipefail
          which clang
          clang --version
          which ld.lld
          ld.lld --version

      - name: Detect STAR defconfig automatically
        run: |
          set -euxo pipefail

          # Find candidate defconfigs containing "star"
          mapfile -t CANDS < <(find arch/arm64/configs -type f -name '*defconfig*' | grep -i 'star' || true)

          if [ "${#CANDS[@]}" -eq 0 ]; then
            echo "ERROR: No STAR defconfig found under arch/arm64/configs"
            echo "Available defconfigs (sample):"
            find arch/arm64/configs -type f -name '*defconfig*' | head -n 200
            exit 1
          fi

          echo "Found STAR defconfig candidates:"
          printf '%s\n' "${CANDS[@]}"

          # Prefer vendor/star-gki_defconfig, then vendor/star-qgki_defconfig, then anything star*
          DEFCONFIG=""
          for p in "${CANDS[@]}"; do
            case "$p" in
              *vendor*star-gki_defconfig) DEFCONFIG="$p"; break;;
            esac
          done
          if [ -z "$DEFCONFIG" ]; then
            for p in "${CANDS[@]}"; do
              case "$p" in
                *vendor*star-qgki_defconfig) DEFCONFIG="$p"; break;;
              esac
            done
          fi
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="${CANDS[0]}"
          fi

          echo "Using DEFCONFIG=$DEFCONFIG"
          echo "DEFCONFIG=$DEFCONFIG" >> $GITHUB_ENV

      - name: Inject SukiSU-Ultra (auto-detect script)
        run: |
          set -euxo pipefail

          rm -rf sukisu
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git sukisu

          echo "Listing SukiSU shell scripts (top 4 levels):"
          find sukisu -maxdepth 4 -type f -name '*.sh' -print | sort || true

          # Try to find a patch/integrate script automatically
          SCRIPT=""
          # common names
          for f in \
            "sukisu/install.sh" \
            "sukisu/patch_kernel.sh" \
            "sukisu/scripts/patch_kernel.sh" \
            "sukisu/scripts/patch.sh" \
            "sukisu/tools/patch_kernel.sh" \
            "sukisu/tools/patch.sh"
          do
            if [ -f "$f" ]; then SCRIPT="$f"; break; fi
          done

          # fallback: search by name patterns
          if [ -z "$SCRIPT" ]; then
            SCRIPT="$(find sukisu -maxdepth 5 -type f -name '*.sh' \
              | grep -Ei '(install|patch).*(kernel|ksu|sukisu)' \
              | head -n1 || true)"
          fi

          if [ -z "$SCRIPT" ] || [ ! -f "$SCRIPT" ]; then
            echo "ERROR: Cannot find SukiSU integrate/patch script automatically."
            echo "Please check repo structure above and adjust script list if needed."
            exit 127
          fi

          echo "Using SukiSU script: $SCRIPT"
          chmod +x "$SCRIPT"

          # Run script from repo root (your kernel tree)
          # Many scripts expect to be run from kernel root.
          bash "$SCRIPT" || bash "$SCRIPT" "${PWD}" || true

      - name: Inject SUSFS (module repo, enable Kconfig symbols)
        run: |
          set -euxo pipefail

          rm -rf susfs
          git clone --depth=1 https://github.com/sidex15/susfs4ksu-module.git susfs

          echo "Listing SUSFS files (top 4 levels):"
          find susfs -maxdepth 4 -type f -print | sort || true

          # Some repos provide patch scripts; try auto-detect
          SUSFS_SCRIPT="$(find susfs -maxdepth 5 -type f -name '*.sh' \
            | grep -Ei '(install|patch|apply).*susfs' \
            | head -n1 || true)"

          if [ -n "$SUSFS_SCRIPT" ] && [ -f "$SUSFS_SCRIPT" ]; then
            echo "Running SUSFS script: $SUSFS_SCRIPT"
            chmod +x "$SUSFS_SCRIPT"
            bash "$SUSFS_SCRIPT" || bash "$SUSFS_SCRIPT" "${PWD}" || true
          else
            echo "No SUSFS patch script detected. Will only enable SUSFS symbols if present."
          fi

      - name: Configure kernel (make defconfig + enable SUSFS symbols)
        run: |
          set -euxo pipefail

          mkdir -p "${O}"
          DEF="${DEFCONFIG#arch/arm64/configs/}"   # make wants relative under configs
          echo "DEF for make: $DEF"

          make O="${O}" ARCH="${ARCH}" LLVM=1 LLVM_IAS=1 "${DEF}"

          # Enable any SUSFS-related Kconfig symbols automatically if they exist
          if [ -f scripts/config ]; then
            chmod +x scripts/config
          fi

          # Find SUSFS symbols in Kconfig (best effort)
          mapfile -t SYMS < <(grep -RIn --include='Kconfig*' -E '^[[:space:]]*config[[:space:]]+.*SUSFS' . \
            | sed -E 's/.*config[[:space:]]+([A-Za-z0-9_]+).*/\1/' \
            | sort -u || true)

          echo "Detected SUSFS symbols:"
          printf '%s\n' "${SYMS[@]}" || true

          for s in "${SYMS[@]}"; do
            ./scripts/config --file "${O}/.config" -e "$s" || true
          done

          # Also try common names (won't fail if absent)
          ./scripts/config --file "${O}/.config" -e CONFIG_SUSFS  || true
          ./scripts/config --file "${O}/.config" -e CONFIG_KSU_SUSFS || true
          ./scripts/config --file "${O}/.config" -e CONFIG_SUSFS_FS || true

          make O="${O}" ARCH="${ARCH}" LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build kernel (LLVM/Clang + LLD)
        run: |
          set -euxo pipefail

          export PATH="${CLANG_DIR}/bin:${PATH}"
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export READELF=llvm-readelf

          make -j"$(nproc)" O="${O}" ARCH="${ARCH}" \
            LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld \
            Image Image.gz dtbs

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts

          # Best effort: copy common outputs
          cp -v "${O}/arch/arm64/boot/Image" artifacts/ 2>/dev/null || true
          cp -v "${O}/arch/arm64/boot/Image.gz" artifacts/ 2>/dev/null || true
          cp -v "${O}/arch/arm64/boot/Image.gz-dtb" artifacts/ 2>/dev/null || true

          # dtbo/dtb packs if present
          find "${O}/arch/arm64/boot/dts" -maxdepth 5 -type f \( -name '*.dtb' -o -name '*.dtbo' \) -print0 \
            | xargs -0 -I{} cp -v "{}" artifacts/ || true

          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-artifacts
          path: artifacts/*
          if-no-files-found: warn
