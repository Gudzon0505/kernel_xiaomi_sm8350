name: Build Star Kernel (SukiSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git curl bc bison flex build-essential libssl-dev libncurses-dev python3

      - name: Inject WildKSU
        run: |
          curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh | bash -s wild

      - name: Enable SUSFS
        run: |
          CONFIG_PATH="arch/arm64/configs/gki_defconfig"

          if [ ! -f "$CONFIG_PATH" ]; then
            echo "gki_defconfig not found at: $CONFIG_PATH"
            echo "Listing arch/arm64/configs:"
            ls -la arch/arm64/configs || true
            exit 1
          fi

          # Enable SUSFS if present as "# CONFIG_SUSFS is not set"
          sed -i 's/# CONFIG_SUSFS is not set/CONFIG_SUSFS=y/' "$CONFIG_PATH"

          # If line wasn't present, append option (safe)
          grep -q '^CONFIG_SUSFS=' "$CONFIG_PATH" || echo 'CONFIG_SUSFS=y' >> "$CONFIG_PATH"

          echo "=== SUSFS lines in defconfig ==="
          grep -n "SUSFS" "$CONFIG_PATH" || true

      - name: Build kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER=Gudzon
          export KBUILD_BUILD_HOST=star

          make gki_defconfig
          make -j"$(nproc)"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: star-sukisu-kernel
          path: arch/arm64/boot/Image
