name: Star Kernel Builder (SukiSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex build-essential libssl-dev \
          libelf-dev dwarves lld llvm clang python3 curl rsync unzip zip

      - name: Download Qualcomm LLVM
        run: |
          mkdir -p $HOME/clang
          cd $HOME/clang
          curl -L -o clang.tar.gz https://github.com/ClangBuiltLinux/tc-build/releases/download/16.0.6/clang-16.0.6.tar.gz
          tar -xf clang.tar.gz
          echo "$HOME/clang/clang-16.0.6/bin" >> $GITHUB_PATH

      - name: Inject SukiSU
        run: |
          curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh | bash -s wild

      - name: Enable SUSFS
        run: |
          DEF=arch/arm64/configs/vendor/star-gki_defconfig
          sed -i 's/# CONFIG_SUSFS is not set/CONFIG_SUSFS=y/' $DEF || true
          grep -q CONFIG_SUSFS $DEF || echo "CONFIG_SUSFS=y" >> $DEF

      - name: Build kernel
        run: |
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1
          make O=out vendor/star-gki_defconfig
          make O=out -j$(nproc)

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: StarKernel-SukiSU-SUSFS
          path: out/arch/arm64/boot/Image
