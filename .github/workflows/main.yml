name: STAR Kernel (SukiSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev \
            make clang lld llvm dwarves ccache rsync zip unzip

      - name: Setup LLVM
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV

      - name: Inject SukiSU-Ultra
        run: |
          git clone --depth=1 https://github.com/SukiSU-Ultra/SukiSU-Ultra.git sukisu
          bash sukisu/install.sh

      - name: Inject SUSFS
        run: |
          git clone --depth=1 https://github.com/sidex15/susfs4ksu-module.git susfs
          bash susfs/install.sh

      - name: Configure kernel (STAR)
        run: |
          mkdir -p out
          make O=out star_defconfig

      - name: Build kernel
        run: |
          make -j$(nproc) O=out

      - name: Pack Image
        run: |
          mkdir artifacts
          cp out/arch/arm64/boot/Image artifacts/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: STAR-KERNEL-SUKISU-SUSFS
          path: artifacts/Image
