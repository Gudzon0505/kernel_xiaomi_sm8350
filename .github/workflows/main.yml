name: Build STAR kernel (SukiSU-Ultra + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT: out

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install deps
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex build-essential make ninja-build \
            libssl-dev libelf-dev libncurses-dev \
            python3 git curl wget rsync unzip xz-utils \
            dwarves \
            clang lld llvm

          clang --version | head -n 1
          ld.lld --version | head -n 1

      # 1) SukiSU-Ultra integration (official approach: kernel/setup.sh builtin)
      # Source: SukiSU-Ultra integration/installation docs. :contentReference[oaicite:4]{index=4}
      - name: Integrate SukiSU-Ultra (builtin)
        run: |
          set -euxo pipefail
          # Run from kernel root (this repo). Script patches/integrates into current tree.
          curl -fsSL https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh \
            | bash -s -- builtin

      # 2) SUSFS: IMPORTANT — susfs4ksu-module does NOT patch kernel.
      # Need susfs4ksu patchset. :contentReference[oaicite:5]{index=5}
      - name: Apply SUSFS patchset (best-effort)
        run: |
          set -euxo pipefail
          rm -rf _susfs4ksu
          # Prefer upstream (GitLab) mirror; GitHub mirror exists too.
          # We'll try GitHub mirror first (more reliable on Actions), then fallback.
          if git clone --depth=1 https://github.com/Star-Seven/susfs4ksu.git _susfs4ksu; then
            echo "Cloned GitHub mirror susfs4ksu"
          else
            git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git _susfs4ksu
            echo "Cloned GitLab susfs4ksu"
          fi

          # Apply all patches found (this is best-effort; real world often needs branch matching KMI)
          # If there are no patches, stop with clear message.
          shopt -s nullglob
          patches=( _susfs4ksu/**/*.patch _susfs4ksu/*.patch )
          if [ ${#patches[@]} -eq 0 ]; then
            echo "ERROR: No *.patch files found in susfs4ksu repo."
            echo "This usually means you need to checkout the branch matching your kernel/KMI."
            exit 1
          fi

          for p in "${patches[@]}"; do
            echo "Applying patch: $p"
            git apply --3way --whitespace=nowarn "$p" || git apply --whitespace=nowarn "$p"
          done

      # 3) Auto-detect STAR defconfig (works for GKI and non-GKI trees)
      - name: Detect STAR defconfig
        id: defcfg
        run: |
          set -euxo pipefail
          # Common candidates first
          CANDS=(
            "arch/arm64/configs/vendor/star-gki_defconfig"
            "arch/arm64/configs/vendor/star_defconfig"
            "arch/arm64/configs/vendor/xiaomi/star_defconfig"
            "arch/arm64/configs/star_defconfig"
            "arch/arm64/configs/star-gki_defconfig"
          )
          DEF=""
          for f in "${CANDS[@]}"; do
            if [ -f "$f" ]; then DEF="$f"; break; fi
          done
          if [ -z "$DEF" ]; then
            DEF="$(find arch/arm64/configs -maxdepth 4 -type f -iname "*star*defconfig*" | head -n 1 || true)"
          fi
          if [ -z "$DEF" ]; then
            echo "ERROR: STAR defconfig not found under arch/arm64/configs"
            find arch/arm64/configs -maxdepth 4 -type f -name "*defconfig*" | head -n 80
            exit 1
          fi
          echo "DEFCONFIG_PATH=$DEF" >> "$GITHUB_OUTPUT"
          echo "Selected: $DEF"

      - name: Configure
        run: |
          set -euxo pipefail
          mkdir -p "${OUT}"
          DEF="${{ steps.defcfg.outputs.DEFCONFIG_PATH }}"
          make O="${OUT}" ARCH=arm64 "${DEF#arch/arm64/configs/}"
          make O="${OUT}" ARCH=arm64 olddefconfig

      - name: Build (clang + lld)
        run: |
          set -euxo pipefail
          make -j"$(nproc)" O="${OUT}" ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld

      - name: Collect artifacts
        run: |
          set -euxo pipefail
          mkdir -p artifacts
          for f in \
            "${OUT}/arch/arm64/boot/Image" \
            "${OUT}/arch/arm64/boot/Image.gz" \
            "${OUT}/arch/arm64/boot/Image.gz-dtb" \
            "${OUT}/arch/arm64/boot/dtbo.img"
          do
            if [ -f "$f" ]; then cp -av "$f" artifacts/; fi
          done
          ls -la artifacts

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STAR-kernel-SukiSU-SUSFS
          path: artifacts/*
          if-no-files-found: error
