name: Build Star Kernel (SukiSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git wget curl rsync unzip \
            bc bison flex build-essential \
            libssl-dev libncurses-dev libelf-dev \
            python3 python3-pip \
            lld llvm clang \
            dwarves

      # ✅ WORKING clang from ClangBuiltLinux (no 404)
      - name: Download Android LLVM (ClangBuiltLinux)
        run: |
          set -e
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          wget -O clang.tar.xz https://github.com/ClangBuiltLinux/tc-build/releases/download/2024-10-20/clang-r547379.tar.xz
          tar -xf clang.tar.xz
          echo "$HOME/clang/clang-r547379/bin" >> "$GITHUB_PATH"

      - name: Verify clang tools
        run: |
          set -e
          which clang
          clang --version
          which ld.lld
          ld.lld --version

      # ✅ WildKSU inject (как у тебя было)
      - name: Inject WildKSU
        run: |
          set -e
          curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh | bash -s wild

      # ✅ SUSFS включаем в ПРАВИЛЬНЫЙ defconfig
      # В логах у тебя есть: arch/arm64/configs/vendor/star-gki_defconfig
      - name: Enable SUSFS in defconfig (STAR)
        run: |
          set -e
          DEF="arch/arm64/configs/vendor/star-gki_defconfig"
          test -f "$DEF"
          # включаем если закомментировано / выключено
          sed -i \
            -e 's/^# CONFIG_SUSFS is not set/CONFIG_SUSFS=y/' \
            -e 's/^CONFIG_SUSFS=m/CONFIG_SUSFS=y/' \
            -e 's/^CONFIG_SUSFS=n/CONFIG_SUSFS=y/' \
            "$DEF"
          # если строки не было — добавим
          grep -q '^CONFIG_SUSFS=' "$DEF" || echo 'CONFIG_SUSFS=y' >> "$DEF"
          tail -n 5 "$DEF"
          grep -n "CONFIG_SUSFS" "$DEF" || true

      - name: Build kernel (LLVM)
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64

          # сборка в out/
          mkdir -p out

          # LLVM build
          export LLVM=1
          export LLVM_IAS=1
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          # defconfig для STAR (Mi 11 Ultra)
          make O=out vendor/star-gki_defconfig

          # сборка
          make O=out -j"$(nproc)"

          # проверка что Image реально появился
          ls -lah out/arch/arm64/boot/Image

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: star-sukisu-susfs-kernel-Image
          path: out/arch/arm64/boot/Image
```0
