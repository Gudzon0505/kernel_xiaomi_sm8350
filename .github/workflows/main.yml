name: Build Star Kernel (SukiSU + SUSFS)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: "Defconfig name under arch/arm64/configs (example: vendor/star-gki_defconfig)"
        required: false
        default: "vendor/star-gki_defconfig"
      jobs:
        description: "Parallel jobs for make"
        required: false
        default: "16"
      enable_susfs:
        description: "Enable SUSFS config injection (if your repo has scripts for it)"
        required: false
        default: "true"
      inject_sukisu:
        description: "Inject SukiSU (if your repo has scripts for it)"
        required: false
        default: "true"
      inject_wildksu:
        description: "Inject WildKSU (if your repo has scripts for it)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: ${{ inputs.defconfig }}
      JOBS: ${{ inputs.jobs }}

      # Official Android LLVM (Google) archive from googlesource.
      # If you want another clang revision later — change CLANG_REV and the URL accordingly.
      CLANG_REV: clang-r522817
      CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates ccache curl flex \
            git gnupg gperf libelf-dev libncurses-dev libssl-dev \
            lz4 rsync unzip wget xz-utils zstd python3

      - name: Download Android LLVM (Google)
        run: |
          set -e
          mkdir -p "$HOME/clang"
          cd "$HOME/clang"
          echo "Downloading: $CLANG_URL"
          wget -O clang.tar.gz "$CLANG_URL"
          mkdir -p "$CLANG_REV"
          tar -xzf clang.tar.gz -C "$CLANG_REV"
          echo "LLVM unpacked to: $HOME/clang/$CLANG_REV"

      - name: Verify clang tools
        run: |
          set -e
          export PATH="$HOME/clang/$CLANG_REV/bin:$PATH"
          which clang
          clang --version
          which ld.lld
          ld.lld --version
          which llvm-ar
          llvm-ar --version

      # Optional: Inject SukiSU / WildKSU
      # ВАЖНО: пути скриптов зависят от твоего репо.
      # Если у тебя другие имена/пути — просто поменяй команды внутри шагов.
      - name: Inject SukiSU (optional)
        if: ${{ inputs.inject_sukisu == 'true' }}
        run: |
          set -e
          echo "Inject SukiSU enabled."
          if [ -f "./scripts/sukisu/inject.sh" ]; then
            bash ./scripts/sukisu/inject.sh
          elif [ -f "./scripts/ksu/inject_sukisu.sh" ]; then
            bash ./scripts/ksu/inject_sukisu.sh
          else
            echo "No SukiSU inject script found. Skipping."
          fi

      - name: Inject WildKSU (optional)
        if: ${{ inputs.inject_wildksu == 'true' }}
        run: |
          set -e
          echo "Inject WildKSU enabled."
          if [ -f "./scripts/wildksu/inject.sh" ]; then
            bash ./scripts/wildksu/inject.sh
          elif [ -f "./scripts/ksu/inject_wildksu.sh" ]; then
            bash ./scripts/ksu/inject_wildksu.sh
          else
            echo "No WildKSU inject script found. Skipping."
          fi

      - name: Prepare defconfig
        run: |
          set -e
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "ERROR: defconfig not found: arch/arm64/configs/$DEFCONFIG"
            echo "Hint: check your available defconfigs under arch/arm64/configs/vendor/"
            exit 1
          fi
          echo "Using defconfig: $DEFCONFIG"

      # Optional: Enable SUSFS in defconfig (если у тебя есть готовый патчер/скрипт)
      - name: Enable SUSFS (optional)
        if: ${{ inputs.enable_susfs == 'true' }}
        run: |
          set -e
          echo "Enable SUSFS requested."
          # Примеры возможных скриптов. Если у тебя другой — подставь свой.
          if [ -f "./scripts/susfs/enable.sh" ]; then
            bash ./scripts/susfs/enable.sh "arch/arm64/configs/$DEFCONFIG"
          elif [ -f "./scripts/enable_susfs.sh" ]; then
            bash ./scripts/enable_susfs.sh "arch/arm64/configs/$DEFCONFIG"
          else
            echo "No SUSFS enable script found. Skipping."
          fi

      - name: Build kernel (LLVM)
        run: |
          set -e
          export PATH="$HOME/clang/$CLANG_REV/bin:$PATH"

          # ccache (optional, helps speed)
          export CCACHE_DIR="$HOME/.ccache"
          ccache -M 5G || true

          # Clean build dir
          rm -rf out
          mkdir -p out

          # Configure
          make O=out ARCH=arm64 "$DEFCONFIG"

          # Build with LLVM toolchain
          make -j"$JOBS" O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CC=clang LD=ld.lld \
            AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            Image dtbs dtbo.img || make -j"$JOBS" O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 Image

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p artifacts

          # Image
          if [ -f "out/arch/arm64/boot/Image" ]; then
            cp -v out/arch/arm64/boot/Image artifacts/
          fi

          # dtbo
          if [ -f "out/arch/arm64/boot/dtbo.img" ]; then
            cp -v out/arch/arm64/boot/dtbo.img artifacts/
          fi

          # dtb(s)
          if [ -d "out/arch/arm64/boot/dts" ]; then
            tar -czf artifacts/dts.tar.gz -C out/arch/arm64/boot dts || true
          fi

          # config
          if [ -f "out/.config" ]; then
            cp -v out/.config artifacts/config.txt
          fi

          ls -lah artifacts || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: star-kernel-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: warn
