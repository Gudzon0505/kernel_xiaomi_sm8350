name: Build Star Kernel (SukiSU + SUSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Устанавливаем полный LLVM toolchain
      - name: Install full LLVM toolchain
        run: |
          sudo apt update
          sudo apt install -y \
            clang lld llvm \
            git curl bc bison flex build-essential \
            libssl-dev libncurses-dev python3 dwarves rsync unzip file

          which clang
          which ld.lld
          ld.lld --version

      - name: Inject WildKSU
        run: |
          curl -LSs https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh | bash -s wild

      - name: Enable SUSFS
        run: |
          DEF="arch/arm64/configs/vendor/xiaomi/star_defconfig"
          sed -i 's/^# CONFIG_SUSFS is not set/CONFIG_SUSFS=y/' "$DEF" || true
          grep -q '^CONFIG_SUSFS=' "$DEF" || echo 'CONFIG_SUSFS=y' >> "$DEF"

      - name: Build kernel (LLVM only)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export HOSTCC=clang
          export LD=ld.lld
          export LLVM=1
          export LLVM_IAS=1

          make vendor/xiaomi/star_defconfig
          make -j$(nproc)

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: star-sukisu-kernel
          path: arch/arm64/boot/Image
